title: PowerShell Process Creation
id: 9366f5dc-c86a-46e0-971e-detection-lab-0002
status: experimental
description: Detects PowerShell process execution from Windows process creation telemetry.
author: Detection Lab
date: 2026/05/31
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
  condition: selection
fields:
  - Image
  - CommandLine
  - ParentImage
falsepositives:
  - Administrator activity
  - Software deployment scripts
level: low
